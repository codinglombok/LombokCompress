name: Go

on:
  push:
    branches: [main]
    paths: ['go/**']
  pull_request:
    branches: [main]
    paths: ['go/**']

defaults:
  run:
    working-directory: go

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', '1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
