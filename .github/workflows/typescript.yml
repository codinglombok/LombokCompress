name: TypeScript

on:
  push:
    branches: [main]
    paths: ['typescript/**']
  pull_request:
    branches: [main]
    paths: ['typescript/**']

defaults:
  run:
    working-directory: typescript

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
