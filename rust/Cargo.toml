[package]
name = "lombokcompress"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["codinglombok <codinglombok@gmail.com>"]
description = "Universal zero-dependency compression library: LZ4, Zstandard, Deflate/gzip/zlib. Part of Lombok Ecosystem."
license = "Apache-2.0"
repository = "https://github.com/codinglombok/LombokCompress"
keywords = ["compression", "lz4", "zstd", "deflate", "no_std"]
categories = ["compression", "no-std"]

[features]
default = ["lz4", "std"]
lz4 = []
zstd = []
deflate = []
std = []

[lib]
name = "lombokcompress"
path = "src/lib.rs"
